<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Classic Macintosh 1984 Warm Beige Gradient -->
    <linearGradient id="macBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E1"/>
      <stop offset="65%" stop-color="#E5DEC9"/>
      <stop offset="100%" stop-color="#CFC6AE"/>
    </linearGradient>
    <linearGradient id="macBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8D0B8"/>
      <stop offset="100%" stop-color="#B8AF96"/>
    </linearGradient>
    <!-- Retro CRT Screen Cyan-Blue Gradient -->
    <linearGradient id="crtScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <!-- USB Metallic Gradient -->
    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main Macintosh 1984 Chassis -->
  <g filter="url(#dropShadow)">
    <!-- Lower recessed base -->
    <rect x="108" y="365" width="296" height="58" rx="18" fill="url(#macBase)" stroke="#9C927A" stroke-width="4"/>
    <!-- Main upper monitor casing -->
    <rect x="92" y="42" width="328" height="346" rx="34" fill="url(#macBody)" stroke="#B5AC94" stroke-width="5"/>
  </g>

  <!-- Inner Bezel Recess -->
  <rect x="120" y="70" width="272" height="214" rx="22" fill="#C4B9A0" stroke="#9E947C" stroke-width="3"/>

  <!-- CRT Screen -->
  <rect x="130" y="80" width="252" height="194" rx="16" fill="url(#crtScreen)" stroke="#075985" stroke-width="4"/>

  <!-- Screen Glare -->
  <path d="M142 92 H340 L142 230 Z" fill="#FFFFFF" opacity="0.14"/>

  <!-- Floppy Drive Slot & Classic Rainbow Badge -->
  <rect x="268" y="322" width="114" height="14" rx="6" fill="#334155"/>
  <rect x="292" y="325" width="66" height="8" rx="3" fill="#0F172A"/>

  <!-- Retro 6-color Badge -->
  <g transform="translate(136, 317)">
    <rect x="0" y="0" width="24" height="4" rx="1" fill="#61BB46"/>
    <rect x="0" y="4" width="24" height="4" rx="1" fill="#FDB827"/>
    <rect x="0" y="8" width="24" height="4" rx="1" fill="#F5821F"/>
    <rect x="0" y="12" width="24" height="4" rx="1" fill="#E03A3E"/>
    <rect x="0" y="16" width="24" height="4" rx="1" fill="#963D97"/>
    <rect x="0" y="20" width="24" height="4" rx="1" fill="#009DDC"/>
  </g>

  <!-- Glowing Broom & Sparkles inside CRT Screen -->
  <g transform="translate(256, 178) rotate(-28)">
    <!-- Broom Handle -->
    <rect x="-7" y="-76" width="14" height="78" rx="7" fill="#FDE047" stroke="#CA8A04" stroke-width="3"/>
    <!-- Broom Collar -->
    <rect x="-24" y="-8" width="48" height="14" rx="6" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
    <!-- Broom Bristles -->
    <path d="M-26 6 L26 6 L40 60 C40 66 34 70 26 70 L-26 70 C-34 70 -40 66 -40 60 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="3"/>
    <line x1="-14" y1="22" x2="-18" y2="66" stroke="#CA8A04" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="68" stroke="#CA8A04" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="22" x2="18" y2="66" stroke="#CA8A04" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sparkles on Screen -->
  <path d="M174 118 L180 134 L196 140 L180 146 L174 162 L168 146 L152 140 L168 134 Z" fill="#FFFFFF"/>
  <path d="M332 114 L336 126 L348 130 L336 134 L332 146 L328 134 L316 130 L328 126 Z" fill="#FEF08A"/>
  <circle cx="195" cy="222" r="6" fill="#E0F2FE"/>
  <circle cx="338" cy="212" r="5" fill="#FFFFFF"/>

  <!-- Integrated USB-A Connector at Bottom of Macintosh -->
  <g filter="url(#dropShadow)">
    <!-- USB Collar / Neck -->
    <rect x="206" y="408" width="100" height="24" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    <!-- USB Metal Plug -->
    <rect x="218" y="430" width="76" height="58" rx="6" fill="url(#usbMetal)" stroke="#475569" stroke-width="4"/>
    <!-- USB Contact Holes -->
    <rect x="232" y="446" width="16" height="22" rx="3" fill="#1E293B"/>
    <rect x="264" y="446" width="16" height="22" rx="3" fill="#1E293B"/>
    <rect x="235" y="454" width="10" height="8" fill="#FACC15"/>
    <rect x="267" y="454" width="10" height="8" fill="#FACC15"/>
  </g>
</svg>
